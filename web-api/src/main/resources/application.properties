spring.application.name=chatbot

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://mysql:3306/chatbot?useSSL=false&characterEncoding=UTF-8&useUnicode=true&connectionCollation=utf8mb4_unicode_ci
spring.jpa.properties.hibernate.connection.characterEncoding=utf8mb4
spring.jpa.properties.hibernate.connection.useUnicode=true
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update

spring.output.ansi.enabled=ALWAYS

api.security.token.secret=secret_key

spring.config.import=vault://
spring.cloud.vault.uri=${VAULT_URI:http://localhost:8200}
spring.cloud.vault.token=${VAULT_TOKEN:root-token-dev}
spring.cloud.vault.authentication=TOKEN
spring.cloud.vault.kv.enabled=true
spring.cloud.vault.kv.backend=secret
spring.cloud.vault.kv.default-context=efi-bank
spring.cloud.vault.fail-fast=true

efi-bank.base-url=https://pix-h.api.efipay.com.br
efi-bank.default-expiration-seconds=3600
efi-bank.mocked-amount=10.00
efi-bank.webhook-url=${EFI_WEBHOOK_URL:}
